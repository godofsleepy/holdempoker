<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold'em Party</title>
<meta name="description" content="Texas Hold'em with friends. Beginner friendly.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23E8413C'/><circle cx='50' cy='50' r='30' fill='%23FFC233'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="cloud" style="top: 8%; animation-duration: 70s; animation-delay: -20s"><span style="width: 90px; height: 46px"></span><span style="width: 76px; height: 76px; margin-left: -38px"></span><span style="width: 100px; height: 50px; margin-left: -30px"></span></div>
  <div class="cloud" style="top: 46%; animation-duration: 95s; animation-delay: -60s; opacity: .8"><span style="width: 70px; height: 38px"></span><span style="width: 60px; height: 60px; margin-left: -28px"></span><span style="width: 80px; height: 42px; margin-left: -22px"></span></div>
  <div class="cloud" style="top: 72%; animation-duration: 120s; animation-delay: -10s; opacity: .7"><span style="width: 60px; height: 32px"></span><span style="width: 52px; height: 52px; margin-left: -24px"></span><span style="width: 70px; height: 36px; margin-left: -20px"></span></div>
</div>
<main id="lobby" class="lobby">
  <section class="hero">
    <canvas id="logo3d" aria-hidden="true"></canvas>
    <h1 class="title">HOLD'EM PARTY!</h1>
    <p class="tagline">Texas Hold'em with friends. Never played? We’ll guide you.</p>
    <div class="pills"><span>2–8 players</span><span>Free chips</span><span>Beginner hints</span></div>
  </section>
  <section class="panel">
    <h2>1. Pick your buddy</h2>
    <div class="avatars" id="avatars" role="radiogroup" aria-label="Pick your buddy"></div>
    <label for="name" class="h2">2. Your name</label>
    <input id="name" placeholder="e.g. Lucky Frog" maxlength="16" autocomplete="nickname">
    <button class="chunky yellow big" id="create">CREATE TABLE</button>
    <div class="or"><span></span>or join your friends<span></span></div>
    <div class="join">
      <label class="sr" for="code">Table code</label>
      <input id="code" placeholder="CODE" maxlength="4" autocomplete="off">
      <button class="chunky blue" id="join">JOIN</button>
    </div>
    <button class="linkbtn" data-guide>New to poker? Learn it in 1 minute →</button>
  </section>
  <div class="hill" aria-hidden="true"></div>
</main>

<main id="game" class="game" hidden>
  <div class="stage wide" id="stage">
    <canvas id="table3d" aria-hidden="true"></canvas>
    <div class="felt" aria-hidden="true"></div>

    <div class="hud hud-left">
      <div class="tablechip"><span class="chipicon"></span><span class="tablelabel">TABLE</span> <b id="roomCode"></b></div>
      <span class="blinds">Blinds 10 / 20</span>
    </div>
    <div class="ticker" id="ticker" aria-live="polite"></div>
    <div class="hud hud-right">
      <button class="hudbtn guidebtn" data-guide>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M10 8.5a2 2 0 1 1 2.5 1.9c-.5.2-.5.6-.5 1.1"/><path d="M12 14.5h.01"/></svg>
        <span>Hand guide</span>
      </button>
      <button class="hudbtn round" id="invite" aria-label="Copy invite link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      </button>
      <button class="hudbtn round" id="sound" aria-label="Turn sound off">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>
      </button>
      <button class="hudbtn round" id="leave" aria-label="Leave table">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>

    <div id="seats"></div>
    <div id="bets"></div>
    <div class="pot" id="pot">POT 0</div>
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="streets"><span class="flop">FLOP · 3 shared cards</span><span>TURN</span><span>RIVER</span></div>
    </div>
    <div class="helper" id="helper" hidden></div>
    <div class="mycards" id="mycards"></div>
    <div class="me" id="me"></div>
    <div class="actions" id="actions"></div>
    <div class="banner" id="banner" hidden></div>
  </div>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="guide" id="guide" aria-label="Hand guide" hidden>
  <div class="guide-head">
    <div class="guide-title">
      <div>
        <h2>HAND GUIDE</h2>
        <p>Poker in one minute. No experience needed.</p>
      </div>
      <button class="close" id="guideClose" aria-label="Close guide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="hands" aria-selected="true">Hands</button>
      <button role="tab" data-tab="play" aria-selected="false">How to play</button>
      <button role="tab" data-tab="buttons" aria-selected="false">Buttons</button>
    </div>
  </div>
  <div class="guide-body" id="guideBody"></div>
</aside>

<div id="toast" role="status" hidden></div>
</body>
</html>
